name: Test

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Install client dev dependencies
        run: npm --prefix src/client ci

      - name: Race budget unit tests
        run: npm run test:race-budget

      - name: Check Race 3D asset budget
        run: npm run check:race-budget
